<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Price ladder for dairy-free ice cream in the UK</title><desc id="d">Swedish Glace £4.67 per litre, proposed oat brand £9.00 per litre, Ben &amp; Jerry's Non-Dairy about £11.83 per litre.</desc>
<rect width="1200" height="560" rx="24" fill="#fffaf5"/>
<text x="48" y="64" font-size="32" fill="#1f1a17" text-anchor="start" font-weight="700">The gap on the dairy-free shelf is in the middle</text><text x="48" y="100" font-size="20" fill="#6b625b" text-anchor="start" font-weight="400">Shelf price per litre in UK supermarkets, 2026</text><line x1="470" y1="148" x2="470" y2="460" stroke="#e8dfd6" stroke-width="1"/><text x="470" y="486" font-size="16" fill="#6b625b" text-anchor="middle" font-weight="400">£0</text><line x1="678" y1="148" x2="678" y2="460" stroke="#e8dfd6" stroke-width="1"/><text x="678" y="486" font-size="16" fill="#6b625b" text-anchor="middle" font-weight="400">£4</text><line x1="886" y1="148" x2="886" y2="460" stroke="#e8dfd6" stroke-width="1"/><text x="886" y="486" font-size="16" fill="#6b625b" text-anchor="middle" font-weight="400">£8</text><line x1="1094" y1="148" x2="1094" y2="460" stroke="#e8dfd6" stroke-width="1"/><text x="1094" y="486" font-size="16" fill="#6b625b" text-anchor="middle" font-weight="400">£12</text><rect x="470" y="160" width="242.84" height="52" rx="6" fill="#8a8178"/><text x="48" y="186" font-size="20" fill="#1f1a17" text-anchor="start" font-weight="400">Swedish Glace non-dairy, 750 ml</text><text x="48" y="212" font-size="16" fill="#6b625b" text-anchor="start" font-weight="400">Tesco shelf price, £3.50</text><text x="724.84" y="194" font-size="20" fill="#1f1a17" text-anchor="start" font-weight="700">£4.67/L</text><rect x="470" y="260" width="468.0" height="52" rx="6" fill="#c2410c"/><text x="48" y="286" font-size="20" fill="#1f1a17" text-anchor="start" font-weight="700">Our target: premium Nordic oat, 500 ml</text><text x="48" y="312" font-size="16" fill="#6b625b" text-anchor="start" font-weight="400">Proposed £4.50 a tub</text><text x="950.0" y="294" font-size="20" fill="#c2410c" text-anchor="start" font-weight="700">£9.00/L</text><rect x="470" y="360" width="615.16" height="52" rx="6" fill="#8a8178"/><text x="48" y="386" font-size="20" fill="#1f1a17" text-anchor="start" font-weight="400">Ben &amp; Jerry's Non-Dairy, 465 ml</text><text x="48" y="412" font-size="16" fill="#6b625b" text-anchor="start" font-weight="400">About £5–6 a tub (midpoint)</text><text x="1097.1599999999999" y="394" font-size="20" fill="#1f1a17" text-anchor="start" font-weight="700">£11.83/L</text><text x="48" y="532" font-size="16" fill="#6b625b" text-anchor="start" font-weight="400">Sources: Tesco.com, Nov 2026 (£3.50 for 750 ml); isitvegan UK guide, Apr 2026 (£5–6 a 465 ml tub). Target is our proposal.</text>
</svg>