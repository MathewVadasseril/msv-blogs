<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Split of a £4.50 tub between VAT, retailer, distributor, logistics, production and producer</title><desc id="d">Export: producer keeps £0.65 a tub. Own subsidiary: producer keeps £1.06 a tub before about £500,000 a year of UK overheads.</desc>
<rect width="1200" height="700" rx="24" fill="#fffaf5"/>
<text x="48" y="64" font-size="32" fill="#1f1a17" text-anchor="start" font-weight="700">Where a £4.50 tub's money goes</text><text x="48" y="100" font-size="20" fill="#6b625b" text-anchor="start" font-weight="400">Illustrative model per 500 ml tub. Tariff is £0 under the EU–UK trade deal if origin rules are met</text><text x="48" y="202" font-size="20" fill="#1f1a17" text-anchor="start" font-weight="700">Export via a UK distributor</text><rect x="300" y="220" width="127.5" height="70" fill="#9c8f84" stroke="#fffaf5" stroke-width="2"/><text x="363.75" y="262.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">£0.75</text><rect x="427.5" y="220" width="222.70000000000002" height="70" fill="#c9b8a6" stroke="#fffaf5" stroke-width="2"/><text x="538.85" y="262.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">£1.31</text><rect x="650.2" y="220" width="103.7" height="70" fill="#e0a77f" stroke="#fffaf5" stroke-width="2"/><text x="702.0500000000001" y="262.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">£0.61</text><rect x="753.9000000000001" y="220" width="30.599999999999998" height="70" fill="#7d6e63" stroke="#fffaf5" stroke-width="2"/><rect x="784.5000000000001" y="220" width="170.0" height="70" fill="#4d4440" stroke="#fffaf5" stroke-width="2"/><text x="869.5000000000001" y="262.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">£1.00</text><rect x="954.5000000000001" y="220" width="110.5" height="70" fill="#c2410c" stroke="#fffaf5" stroke-width="2"/><text x="1009.7500000000001" y="262.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">£0.65</text><text x="48" y="262.0" font-size="18" fill="#1f1a17" text-anchor="start" font-weight="400"></text><text x="48" y="352" font-size="20" fill="#1f1a17" text-anchor="start" font-weight="700">Own UK sales subsidiary</text><rect x="300" y="370" width="127.5" height="70" fill="#9c8f84" stroke="#fffaf5" stroke-width="2"/><text x="363.75" y="412.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">£0.75</text><rect x="427.5" y="370" width="222.70000000000002" height="70" fill="#c9b8a6" stroke="#fffaf5" stroke-width="2"/><text x="538.85" y="412.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">£1.31</text><rect x="650.2" y="370" width="64.6" height="70" fill="#7d6e63" stroke="#fffaf5" stroke-width="2"/><text x="682.5" y="412.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">£0.38</text><rect x="714.8000000000001" y="370" width="170.0" height="70" fill="#4d4440" stroke="#fffaf5" stroke-width="2"/><text x="799.8000000000001" y="412.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">£1.00</text><rect x="884.8000000000001" y="370" width="180.20000000000002" height="70" fill="#c2410c" stroke="#fffaf5" stroke-width="2"/><text x="974.9000000000001" y="412.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">£1.06</text><text x="48" y="412.0" font-size="18" fill="#1f1a17" text-anchor="start" font-weight="400"></text><rect x="48" y="500" width="22" height="22" rx="4" fill="#9c8f84"/><text x="80" y="518" font-size="18" fill="#1f1a17" text-anchor="start" font-weight="400">VAT (20%)</text><rect x="418" y="500" width="22" height="22" rx="4" fill="#c9b8a6"/><text x="450" y="518" font-size="18" fill="#1f1a17" text-anchor="start" font-weight="400">Retailer margin</text><rect x="788" y="500" width="22" height="22" rx="4" fill="#e0a77f"/><text x="820" y="518" font-size="18" fill="#1f1a17" text-anchor="start" font-weight="400">UK distributor margin</text><rect x="48" y="544" width="22" height="22" rx="4" fill="#7d6e63"/><text x="80" y="562" font-size="18" fill="#1f1a17" text-anchor="start" font-weight="400">Freight, cold store, customs</text><rect x="418" y="544" width="22" height="22" rx="4" fill="#4d4440"/><text x="450" y="562" font-size="18" fill="#1f1a17" text-anchor="start" font-weight="400">Production cost</text><rect x="788" y="544" width="22" height="22" rx="4" fill="#c2410c"/><text x="820" y="562" font-size="18" fill="#1f1a17" text-anchor="start" font-weight="400">Left for the producer</text><text x="48" y="620" font-size="18" fill="#1f1a17" text-anchor="start" font-weight="400">Subsidiary keeps £0.41 more per tub but carries about £500k a year of UK overheads (team, office, listings).</text><text x="48" y="672" font-size="16" fill="#6b625b" text-anchor="start" font-weight="400">My assumptions: 35% retailer and 25% distributor margins, £1.00 to make a tub. VAT: HMRC VFOOD5520. Tariff: gov.uk TCA guidance.</text>
