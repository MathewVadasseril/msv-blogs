<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Break-even between exporting and a UK subsidiary</title><desc id="d">Export earns £0.65 per tub; a subsidiary earns £1.06 per tub minus £500,000 fixed cost a year; the lines cross at about 1.2 million tubs a year.</desc>
<rect width="1200" height="640" rx="24" fill="#fffaf5"/>
<text x="48" y="64" font-size="32" fill="#1f1a17" text-anchor="start" font-weight="700">When does a UK subsidiary beat exporting?</text><text x="48" y="100" font-size="20" fill="#6b625b" text-anchor="start" font-weight="400">Yearly contribution in £ million against tubs sold a year (illustrative model)</text><line x1="140" y1="507.14285714285717" x2="1100" y2="507.14285714285717" stroke="#e8dfd6" stroke-width="1"/><text x="128" y="513.1428571428571" font-size="16" fill="#6b625b" text-anchor="end" font-weight="400">−£0.5m</text><line x1="140" y1="442.8571428571429" x2="1100" y2="442.8571428571429" stroke="#6b625b" stroke-width="2"/><text x="128" y="448.8571428571429" font-size="16" fill="#6b625b" text-anchor="end" font-weight="400">£0.0m</text><line x1="140" y1="378.57142857142856" x2="1100" y2="378.57142857142856" stroke="#e8dfd6" stroke-width="1"/><text x="128" y="384.57142857142856" font-size="16" fill="#6b625b" text-anchor="end" font-weight="400">£0.5m</text><line x1="140" y1="314.28571428571433" x2="1100" y2="314.28571428571433" stroke="#e8dfd6" stroke-width="1"/><text x="128" y="320.28571428571433" font-size="16" fill="#6b625b" text-anchor="end" font-weight="400">£1.0m</text><line x1="140" y1="250.0" x2="1100" y2="250.0" stroke="#e8dfd6" stroke-width="1"/><text x="128" y="256.0" font-size="16" fill="#6b625b" text-anchor="end" font-weight="400">£1.5m</text><line x1="140" y1="185.71428571428572" x2="1100" y2="185.71428571428572" stroke="#e8dfd6" stroke-width="1"/><text x="128" y="191.71428571428572" font-size="16" fill="#6b625b" text-anchor="end" font-weight="400">£2.0m</text><text x="140.0" y="548" font-size="16" fill="#6b625b" text-anchor="middle" font-weight="400">0.0m</text><text x="332.0" y="548" font-size="16" fill="#6b625b" text-anchor="middle" font-weight="400">0.5m</text><text x="524.0" y="548" font-size="16" fill="#6b625b" text-anchor="middle" font-weight="400">1.0m</text><text x="716.0" y="548" font-size="16" fill="#6b625b" text-anchor="middle" font-weight="400">1.5m</text><text x="908.0" y="548" font-size="16" fill="#6b625b" text-anchor="middle" font-weight="400">2.0m</text><text x="1100.0" y="548" font-size="16" fill="#6b625b" text-anchor="middle" font-weight="400">2.5m</text><text x="620.0" y="578" font-size="17" fill="#6b625b" text-anchor="middle" font-weight="400">Tubs sold a year (millions)</text><line x1="140.0" y1="442.8571428571429" x2="1100.0" y2="233.92857142857144" stroke="#8a8178" stroke-width="5" stroke-linecap="round"/><line x1="140.0" y1="507.14285714285717" x2="1100.0" y2="166.4285714285714" stroke="#c2410c" stroke-width="5" stroke-linecap="round"/><line x1="608.2926829268292" y1="520.0" x2="608.2926829268292" y2="340.94076655052265" stroke="#1f1a17" stroke-dasharray="6 6" stroke-width="2"/><circle cx="608.2926829268292" cy="340.94076655052265" r="9" fill="#1f1a17"/><text x="624.2926829268292" y="380.94076655052265" font-size="20" fill="#1f1a17" text-anchor="start" font-weight="700">Break-even ≈ 1.2m tubs a year</text><text x="624.2926829268292" y="406.94076655052265" font-size="18" fill="#6b625b" text-anchor="start" font-weight="400">(about £5.5m at the shelf)</text><line x1="140" y1="140" x2="180" y2="140" stroke="#8a8178" stroke-width="5"/><text x="190" y="147" font-size="19" fill="#8a8178" text-anchor="start" font-weight="700">Export: £0.65 a tub</text><line x1="440" y1="140" x2="480" y2="140" stroke="#c2410c" stroke-width="5"/><text x="490" y="147" font-size="19" fill="#c2410c" text-anchor="start" font-weight="700">Subsidiary: £1.06 a tub minus £0.5m a year</text><text x="48" y="612" font-size="16" fill="#6b625b" text-anchor="start" font-weight="400">Same assumptions as the cost split above. Marketing spend is left out because it is needed in both routes.</text>
</svg>